    <h2>💡灯泡切换demo（点击灯泡开关）</h2>
    <p>点击灯泡可以切换亮灭</p>
    <img id="myImage" onclick="changeImage()"
         src="https://www.w3schools.com/js/pic_bulboff.gif"
         width="100" height="180">

    <script>
        function changeImage(){
            const element = document.getElementById('myImage');
            console.log(element);
            if (element.src.includes("pic_bulboff.gif")){
                element.src = "https://www.w3schools.com/js/pic_bulbon.gif";
                console.log("灯亮了");
            }else{
                element.src = "https://www.w3schools.com/js/pic_bulboff.gif";
                console.log("灯灭了");
            }
        }
    </script>

    <h2>📊BMI计算演示（控制台查看结果）</h2>
    <p>按F12打开控制台查看打印信息</p>
    <script>
        let weight = prompt("请输入你的体重(kg)");
        let height = prompt("请输入你的身高(m)");

        console.log("weight原始类型：", typeof weight);
        console.log("height原始类型：", typeof height);

        weight = parseFloat(weight);
        height = parseFloat(height);

        let bmi = weight / (height * height);
        console.log("你的BMI值 = ", bmi);

        let level;
        if(bmi <18.5){
            level = "偏瘦";
        }else if(bmi >=18.5 && bmi <24){
            level = "正常";
        }else if(bmi >=24 && bmi <28){
            level = "超重";
        }else{
            level = "肥胖";
        }
        console.log("BMI评估结果："+level);
        alert(`你的BMI=${bmi.toFixed(2)}，评估：${level}`);
    </script>
